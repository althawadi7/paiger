<style>

*,*:before,*:after{box-sizing:inherit}
*{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(80px + env(safe-area-inset-top,0px))}
body{background:var(--bg);color:var(--ink);font-family:"Readex Pro",system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}
:focus-visible{outline:2px solid var(--go);outline-offset:3px}

nav{position:sticky;top:0;z-index:30;background:rgba(244,245,249,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nv{display:flex;align-items:center;justify-content:space-between;height:68px;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}
.mk{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 20px rgba(255,77,109,.35)}

.links{display:flex;gap:28px;color:var(--mute);font-size:14.5px}.links a:hover{color:var(--ink)}
.nr{display:flex;gap:10px;align-items:center}
.lang{height:40px;padding:0 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:500;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:14px;font-weight:600;font-size:15px;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.pri{background:var(--ink);color:#fff;box-shadow:0 10px 28px rgba(13,17,32,.25)}
.sec{background:#fff;border:1px solid var(--line)}
.btn.sm{height:40px;padding:0 18px;font-size:13.5px;border-radius:12px}
/* hero */
.hero{position:relative;padding:92px 0 44px}
.hero:before{content:"";position:absolute;inset:-100px 0 auto;height:700px;background:radial-gradient(520px 320px at 80% 20%,rgba(139,123,255,.28),transparent),radial-gradient(460px 300px at 15% 10%,rgba(255,77,109,.2),transparent);pointer-events:none}
.hg{position:relative;display:grid;grid-template-columns:1fr 1.15fr;gap:20px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--mute);box-shadow:0 4px 14px rgba(13,17,32,.05)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--done);animation:lv 2s infinite}
@keyframes lv{70%{box-shadow:0 0 0 7px transparent}0%{box-shadow:0 0 0 0 var(--done)}}
h1{font-size:clamp(34px,5.4vw,62px);line-height:1.12;font-weight:700;letter-spacing:-.02em;margin:18px 0}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:18px;color:var(--mute);max-width:520px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.facts{display:flex;gap:26px;margin-top:34px;flex-wrap:wrap}
.facts b{display:block;font-size:20px}.facts span{font-size:12.5px;color:var(--mute)}
/* 3D stage */
.stage{perspective:1700px;height:540px;display:grid;place-items:center;position:relative}
.scene{width:600px;height:500px;position:relative;transform-style:preserve-3d;transform:scale(var(--k,1)) rotateX(calc(9deg + var(--rx,0deg))) rotateY(calc(-16deg + var(--ry,0deg)));transition:transform .25s ease-out;direction:ltr}
[dir=rtl] .scene .txt{direction:rtl}
.scene[data-state=waiting]{--c:var(--wait)}.scene[data-state=ringing]{--c:var(--ring)}.scene[data-state=onway]{--c:var(--go)}.scene[data-state=done]{--c:var(--done)}
.floor{position:absolute;left:30px;right:30px;bottom:-10px;height:60px;background:radial-gradient(closest-side,rgba(40,50,100,.28),transparent);filter:blur(10px)}
.tablet{position:absolute;left:0;top:50px;width:440px;height:330px;border-radius:28px;background:#fff;padding:20px;box-shadow:0 50px 90px rgba(50,60,120,.25),0 0 0 8px #fff,0 0 0 9px var(--line);transform-style:preserve-3d}
.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.th b{font-size:15px}
.live{width:8px;height:8px;border-radius:50%;background:var(--done)}
.mini{display:flex;gap:8px;margin-bottom:14px}
.mini div{flex:1;background:var(--bg);border-radius:12px;padding:8px 10px;font-size:11px;color:var(--mute)}.mini strong{display:block;color:var(--ink);font-size:18px;line-height:1.2}
.ords{display:flex;gap:10px;align-items:stretch;transform-style:preserve-3d}
.oc{flex:1;border-radius:18px;border:1px solid var(--line);padding:12px;background:#fff;opacity:.55}
.oc .n{font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin:8px 0 2px}
.oc small{color:var(--mute);font-size:11.5px}
.oc.main{opacity:1;border-color:var(--c);box-shadow:0 18px 40px rgba(50,60,120,.22),0 0 0 1px var(--c);transform:translateZ(36px);background:linear-gradient(#fff,#fff);transition:border-color .3s,box-shadow .3s}
.pill{display:inline-block;font-size:10.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);padding:3px 9px;border-radius:99px;transition:color .3s,background .3s}
.rb{width:100%;height:36px;margin-top:10px;border-radius:11px;background:var(--c);color:#fff;font-weight:600;font-size:12px;transition:transform .15s,background .3s}
.rb.press{transform:scale(.92);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 25%,transparent)}
.pw{position:absolute;right:6px;top:0;width:208px;height:420px;transform:translateZ(120px);animation:bob 6s ease-in-out infinite;transform-style:preserve-3d}
@keyframes bob{50%{transform:translateZ(120px) translateY(-14px)}}
.pw:before,.pw:after{content:"";position:absolute;inset:-10px;border-radius:52px;border:3px solid var(--ring);opacity:0}
.scene[data-state=ringing] .pw:before{animation:wv 1.2s infinite}.scene[data-state=ringing] .pw:after{animation:wv 1.2s .6s infinite}
@keyframes wv{from{transform:scale(.95);opacity:.8}to{transform:scale(1.35);opacity:0}}
.phone{width:100%;height:100%;border-radius:38px;padding:8px;background:linear-gradient(145deg,#343a47,#0b0d12);box-shadow:34px 56px 80px rgba(30,35,80,.4),inset 0 0 0 1px rgba(255,255,255,.16)}
.scene[data-state=ringing] .phone{animation:shake .4s infinite}
@keyframes shake{25%{transform:translateX(-5px) rotate(-1deg)}75%{transform:translateX(5px) rotate(1deg)}}
.scr{height:100%;border-radius:30px;padding:10px 12px 14px;display:flex;flex-direction:column;color:#fff;background:radial-gradient(120% 70% at 80% 0,#4a3ba8,transparent 60%),radial-gradient(100% 60% at 0 100%,#7a2358,transparent 60%),#0f1220}
.scene[data-state=ringing] .scr{animation:fl .6s infinite alternate}
@keyframes fl{from{background:radial-gradient(120% 80% at 50% 45%,#7a0f26,transparent 70%),#1a0610}to{background:radial-gradient(120% 80% at 50% 45%,#ff4d6d,transparent 70%),#4a0a1a}}
.isl{width:64px;height:18px;border-radius:12px;background:#000;margin:0 auto}
.clk{text-align:center;font-size:40px;font-weight:200;margin-top:14px;line-height:1}
.dt{text-align:center;font-size:10.5px;opacity:.65;margin:4px 0 12px}
.wd{flex:1;border-radius:22px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);padding:12px;display:flex;flex-direction:column;gap:6px;text-align:center}
.wd .h{display:flex;justify-content:space-between;font-size:10px;opacity:.85}
.wd .bn{font-size:62px;font-weight:700;letter-spacing:-3px;line-height:1.05}
.wd .st{font-size:14px;font-weight:600}.wd .sb{font-size:10.5px;opacity:.75}
.bars{display:flex;gap:4px;margin-top:auto}.bars i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.22);transition:background .3s}.bars i.on{background:#fff}
.chip{position:absolute;padding:10px 14px;border-radius:16px;background:#fff;box-shadow:0 20px 40px rgba(50,60,120,.25);font-size:12.5px;font-weight:500;transform:translateZ(200px) translateY(10px);opacity:0;transition:opacity .35s,transform .35s;white-space:nowrap}
.chip.on{opacity:1;transform:translateZ(200px)}
.c1{left:10px;bottom:70px}.c2{left:120px;bottom:20px}
/* sections */
section{padding:84px 0}
.eyebrow{color:var(--ring);font-weight:600;font-size:13px;letter-spacing:.04em}
h2{font-size:clamp(28px,4vw,42px);line-height:1.2;letter-spacing:-.02em;margin:10px 0 14px}
.sub{color:var(--mute);max-width:560px;font-size:17px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px}
.fc{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;transition:transform .25s,box-shadow .25s}
.fc:hover{transform:translateY(-6px);box-shadow:0 30px 60px rgba(50,60,120,.14)}
.ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:22px;margin-bottom:18px;background:color-mix(in srgb,var(--c) 14%,#fff)}
.fc h3{font-size:18px;margin-bottom:6px}.fc p{color:var(--mute);font-size:14.5px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px;counter-reset:s}
.sp{position:relative;background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px 26px}
.sp:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--grad);color:#fff;font-weight:700;margin-bottom:18px}
.sp h3{font-size:18px;margin-bottom:6px}.sp p{color:var(--mute);font-size:14.5px}
.band{margin:0 22px 70px;border-radius:36px;padding:70px 24px;text-align:center;color:#fff;background:radial-gradient(500px 260px at 85% 0,rgba(255,154,76,.5),transparent),radial-gradient(500px 300px at 10% 100%,rgba(139,123,255,.6),transparent),#12162b}

var lang='ar',state='waiting',$=function(s){return document.querySelector(s)};
function render(){
  var d=D[lang],s=d['s_'+state];
  $('#st').textContent=s[0];$('#sb').textContent=s[1];$('#pill').textContent=s[2];
  $('#mr').textContent=state==='ringing'?1:0;
  var lv={waiting:1,ringing:2,onway:3,done:3}[state],b=$('#bars').children;
  for(var i=0;i<3;i++)b[i].className=i<lv?'on':'';
  $('#ch1').classList.toggle('on',state==='ringing');$('#ch2').classList.toggle('on',state==='onway');
}
function apply(l){
  lang=l;var h=document.documentElement;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';document.title=D[l].t;
  [].forEach.call(document.querySelectorAll('[data-k]'),function(e){e.textContent=D[l][e.dataset.k]});
  $('#lang').textContent=l==='ar'?'EN':'عربي';render();fit();
}
$('#lang').onclick=function(){apply(lang==='ar'?'en':'ar')};
/* demo loop */
var seq=[['waiting',2600],['press',700],['ringing',3600],['onway',2200],['done',1800]];
function run(i){var s=seq[i%seq.length];state=s[0]==='press'?'waiting':s[0];$('#scene').dataset.state=state;$('#rb').classList.toggle('press',s[0]==='press');render();setTimeout(function(){run(i+1)},s[1])}
/* 3D tilt + fit */
var stage=$('#stage'),scene=$('#scene');
function fit(){var k=Math.min(1,(stage.clientWidth-8)/620);scene.style.setProperty('--k',k);document.documentElement.style.setProperty('--k',k)}
addEventListener('resize',fit);
stage.addEventListener('pointermove',function(e){var r=stage.getBoundingClientRect();scene.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*14+'deg');scene.style.setProperty('--rx',(-((e.clientY-r.top)/r.height-.5))*10+'deg')});
stage.addEventListener('pointerleave',function(){scene.style.setProperty('--ry','0deg');scene.style.setProperty('--rx','0deg')});
/* reveal */
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
[].forEach.call(document.querySelectorAll('.rv'),function(e,i){e.style.transitionDelay=(i%3)*80+'ms';io.observe(e)});
apply('ar');run(0);
})();
