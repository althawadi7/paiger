{% macro pair(label, value) -%}
<tr>
  <td style="padding:12px 18px;font-family:'IBM Plex Sans',Arial,sans-serif;font-size:14px;line-height:20px;color:#5f6368;word-break:break-word;">{{ label }}</td>
  <td align="right" style="padding:12px 18px;font-family:'IBM Plex Sans',Arial,sans-serif;font-size:14px;line-height:20px;font-weight:600;color:#111111;word-break:break-word;">{{ value }}</td>
</tr>
{%- endmacro %}
