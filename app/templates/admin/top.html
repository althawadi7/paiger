<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="csrf" content="{{ csrf }}">
<title>{{ t('admin.nOverview') if page == 'overview' else t('admin.nRest') if page == 'restaurants' else t('admin.nPlans') if page == 'plans' else t('admin.nPay') if page == 'payments' else t('admin.nSet') }} · Paiger</title>
<link rel="icon" href="/static/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/admin.css?v={{ static_version('css/admin.css') if static_version is defined else '1' }}">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 20 20"><path d="M3 9l7-5.5L17 9v7.5a1 1 0 0 1-1 1h-3.5v-5h-5v5H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-store" viewBox="0 0 20 20"><path d="M3 8.5V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5M2.5 8.5 4 3.5h12l1.5 5a2.5 2.5 0 0 1-5 0 2.5 2.5 0 0 1-5 0 2.5 2.5 0 0 1-5 0zM8 17v-4.5h4V17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-tag" viewBox="0 0 20 20"><path d="M3 10.6V4a1 1 0 0 1 1-1h6.6a1 1 0 0 1 .7.3l5.6 5.6a1 1 0 0 1 0 1.4l-6.6 6.6a1 1 0 0 1-1.4 0L3.3 11.3a1 1 0 0 1-.3-.7z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="7" r="1.3" fill="currentColor"/></symbol>
  <symbol id="i-card" viewBox="0 0 20 20"><rect x="2.5" y="4.5" width="15" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 8h15M5.5 12.5h3" stroke="currentColor" stroke-width="1.5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 20 20"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 6v4.5M10 13.6h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 6v4l2.5 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-coin" viewBox="0 0 20 20"><ellipse cx="10" cy="6" rx="6" ry="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 6v4c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V6M4 10v4c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-4" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
  <symbol id="i-dl" viewBox="0 0 20 20"><path d="M10 3v10M6 9l4 4 4-4M4 16h12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div class="shell">
  <aside class="side" id="side">
    <div class="wm"><b>Paiger</b><span>ADMIN</span></div>
    <nav class="nav">
      <a href="/admin" {% if page == 'overview' %}aria-current="page"{% endif %}><svg><use href="#i-home"/></svg><span>{{ t('admin.nOverview') }}</span></a>
      <a href="/admin/restaurants" {% if page == 'restaurants' %}aria-current="page"{% endif %}><svg><use href="#i-store"/></svg><span>{{ t('admin.nRest') }}</span><span class="cnt num">{{ restaurant_count }}</span></a>
      <a href="/admin/plans" {% if page == 'plans' %}aria-current="page"{% endif %}><svg><use href="#i-tag"/></svg><span>{{ t('admin.nPlans') }}</span></a>
      <a href="/admin/payments" {% if page == 'payments' %}aria-current="page"{% endif %}><svg><use href="#i-card"/></svg><span>{{ t('admin.nPay') }}</span></a>
      <a href="/admin/settings" {% if page == 'settings' %}aria-current="page"{% endif %}><svg><use href="#i-gear"/></svg><span>{{ t('admin.nSet') }}</span></a>
    </nav>
    <div class="side-foot">
      <div class="me"><i>{{ admin_initial }}</i><div><b>{{ admin_name }}</b><span>{{ t('admin.role') }}</span></div></div>
      <a id="langBtn" href="/lang/{{ 'en' if lang == 'ar' else 'ar' }}">{{ 'English' if lang == 'ar' else 'العربية' }}</a>
      <a href="/admin/logout">{{ t('admin.logout') }}</a>
    </div>
  </aside>
  <main class="main">
    <div class="topbar"><button class="btn btn-quiet" id="menuBtn" type="button" aria-label="Menu"><svg><use href="#i-menu"/></svg></button><b>Paiger Admin</b></div>
