<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ t('meta.title') }}{% endblock %}</title>
{% block theme_color %}<meta name="theme-color" content="#ffffff">{% endblock %}
<link rel="icon" href="/static/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/paiger.css">
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-mark" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="8.4" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55"/><circle cx="16" cy="16" r="3" fill="currentColor"/></symbol>
</svg>
{% block shell_nav %}{% include "partials/nav.html" %}{% endblock %}
{% block content %}{% endblock %}
{% block shell_footer %}{% include "partials/footer.html" %}{% endblock %}
<script>
(function () {
  var nav = document.getElementById("nav");
  var menuBtn = document.getElementById("menuBtn");
  if (!nav || !menuBtn) return;
  menuBtn.addEventListener("click", function () {
    var open = nav.classList.toggle("open");
    menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  nav.querySelectorAll(".nav-links a").forEach(function (a) {
    a.addEventListener("click", function () {
      nav.classList.remove("open");
      menuBtn.setAttribute("aria-expanded", "false");
    });
  });
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
