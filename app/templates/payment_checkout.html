<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>الدفع السريع والمباشر | بيجر دَورك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">

  <!-- MyFatoorah Embedded Session JS (NO external redirection) -->
  <script src="{{ payment_config.session_script_url }}"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #C05621;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Readex Pro', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .payment-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .amount-badge {
      display: inline-block;
      background: rgba(192, 86, 33, 0.15);
      color: #fb923c;
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 20px;
      margin-top: 8px;
      border: 1px solid rgba(192, 86, 33, 0.3);
    }
    .mf-container {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      min-height: 140px;
      margin-bottom: 20px;
    }
    .save-card-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
    }
    .btn-pay {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-pay:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-pay:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .spinner {
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top: 2px solid #fff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .badge-secure {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="payment-box">
  <div class="header">
    <h2>الدفع الإلكتروني المباشر</h2>
    <p style="color: var(--muted); font-size: 14px;">طلب رقم: <strong>{{ order_id }}</strong></p>
    <div class="amount-badge">{{ "%.3f"|format(amount) }} {{ payment_config.currency }}</div>
  </div>

  <!-- Apple Pay / Google Pay / Cards Container -->
  <div id="mf-form" class="mf-container">
    <div style="text-align: center; padding: 40px 0; color: var(--muted); font-size: 14px;" id="loading-placeholder">
      <div class="spinner" style="margin: 0 auto 10px auto;"></div>
      جاري تحميل خيارات الدفع والبطاقات...
    </div>
  </div>

  <label class="save-card-box">
    <input type="checkbox" id="save-card-toggle" checked style="accent-color: var(--primary); width: 16px; height: 16px;">
    <span>حفظ البطاقة للاستخدام في المرات القادمة بنقرة واحدة</span>
  </label>

  <button id="btn-submit" class="btn-pay" onclick="submitPayment()">
    <span class="material-icons-outlined">lock</span>
    <span>تأكيد ودفع الآن</span>
  </button>

  <div class="badge-secure">
    <span class="material-icons-outlined" style="font-size: 14px; color: #10b981;">verified_user</span>
    <span>دفع مشفر ومؤمن بالكامل عبر ماي فاتورة (MyFatoorah)</span>
  </div>
</div>

<script>
  const sessionId = "{{ session_data.SessionId }}";
  const countryCode = "{{ session_data.CountryCode or 'BHR' }}";
  const currency = "{{ payment_config.currency }}";
  const amount = {{ amount }};
  const orderId = "{{ order_id }}";

  let myfatoorahConfig = {
    countryCode: countryCode,
    sessionId: sessionId,
    cardViewId: "mf-form",
    style: {
      direction: "rtl",
      cardHeight: 180,
      tokenHeight: 180,
      input: {
        color: "#f8fafc",
        fontSize: "15px",
        fontFamily: "'Readex Pro', sans-serif",
        inputHeight: "44px",
        inputMargin: "8px",
        borderColor: "rgba(255,255,255,0.1)",
        borderWidth: "1px",
        borderRadius: "10px",
        boxShadow: "none",
        placeHolder: {
          holderName: "الاسم على البطاقة",
          cardNumber: "رقم البطاقة",
          expiryDate: "الشهر / السنة",
          securityCode: "رمز CVV"
        }
      }
    }
  };

  window.addEventListener('DOMContentLoaded', () => {
    try {
      if (typeof myFatoorah !== 'undefined') {
        myFatoorah.init(myfatoorahConfig);
        document.getElementById('loading-placeholder')?.remove();
      }
    } catch (e) {
      console.error("MyFatoorah init error:", e);
    }
  });

  async function submitPayment() {
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> جاري معالجة الدفع...';

    const saveCard = document.getElementById('save-card-toggle').checked;

    myFatoorah.submit()
      .then(async function (response) {
        // response.sessionId contains the validated card payload session
        const payload = {
          order_id: orderId,
          amount: amount,
          session_id: response.sessionId,
          save_card: saveCard,
          customer_name: "Customer",
          customer_phone: "97333000000"
        };

        const res = await fetch('/api/payment/myfatoorah/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.ok && data.redirect_url) {
          window.location.href = data.redirect_url;
        } else if (data.ok) {
          window.location.href = `/payment/success?order_id=${orderId}`;
        } else {
          alert(' فشل الدفع: ' + (data.error || 'يرجى المحاولة مجدداً'));
          btn.disabled = false;
          btn.innerHTML = '<span class="material-icons-outlined">lock</span><span>تأكيد ودفع الآن</span>';
        }
      })
      .catch(function (error) {
        console.error("MyFatoorah submit error:", error);
        alert(' خطأ في بيانات البطاقة المدخلة');
        btn.disabled = false;
        btn.innerHTML = '<span class="material-icons-outlined">lock</span><span>تأكيد ودفع الآن</span>';
      });
  }
</script>

</body>
</html>
