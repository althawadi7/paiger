<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>متابعة الطلب | {{ restaurant.name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
  <style>
    :root {
      --bg: #f6f3ed;
      --card: #ffffff;
      --border: rgba(58, 38, 28, 0.12);
      --ink: #23150d;
      --muted: #7a6656;
      --primary: #3e2415;
      --accent: {{ restaurant.brand_color|default('#C05621') }};
      --radius: 24px;
      --shadow: 0 20px 50px rgba(45, 30, 20, 0.08), 0 4px 15px rgba(45, 30, 20, 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background:
        radial-gradient(1200px 700px at 50% -10%, rgba(192, 86, 33, 0.14), transparent 75%),
        radial-gradient(800px 600px at 90% 70%, rgba(110, 70, 45, 0.08), transparent 75%),
        var(--bg);
      color: var(--ink);
      font-family: "Readex Pro", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .track-box {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 38px 28px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .brand-icon-wrap {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: var(--accent);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
      margin-bottom: 16px;
    }
    .restaurant-name {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .track-desc {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: right;
    }
    .input-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .track-input {
      width: 100%;
      background: #faf8f5;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 22px;
      font-weight: 800;
      font-family: "Sora", sans-serif;
      text-align: center;
      color: var(--primary);
      transition: all 0.2s;
    }
    .track-input:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(192, 86, 33, 0.12);
    }
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 8px 20px rgba(62, 36, 21, 0.2);
    }
    .btn-submit:hover {
      background: #2b190e;
      transform: translateY(-1px);
    }
    .error-alert {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 18px;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 11.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="track-box">
    <div class="brand-icon-wrap">
      <span class="material-icons-outlined" style="font-size: 34px;">{{ restaurant.brand_icon|default('coffee') }}</span>
    </div>

    <h1 class="restaurant-name">{{ restaurant.name }}</h1>
    <p class="track-desc">أدخل رقم طلبك المعطى من الكاشير لمتابعة جاهزيته مباشرة</p>

    {% if error %}
    <div class="error-alert">⚠️ {{ error }}</div>
    {% endif %}

    <form method="GET" action="/r/{{ restaurant.slug }}">
      <div class="input-group">
        <label class="input-label" for="orderNumInput">رقم الطلب (Order #):</label>
        <input type="text" name="num" id="orderNumInput" class="track-input" placeholder="مثال: 42" required autofocus value="{{ num or '' }}">
      </div>

      <button type="submit" class="btn-submit">
        <span class="material-icons-outlined">notifications_active</span>
        <span>متابعة حالة الطلب والبيجر</span>
      </button>
    </form>

    <div class="footer-note">
      <span class="material-icons-outlined" style="font-size: 14px;">verified_user</span>
      <span>نظام البيجر اللحظي الذكي • Paiger</span>
    </div>
  </div>

</body>
</html>
