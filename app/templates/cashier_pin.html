<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>{{ t('pin.title') }} · {{ restaurant.name }} · Paiger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #111111; --grey: #5f6368; --grey-2: #8e8e93; --line: #e6e6e8;
  --paper: #ffffff; --paper-2: #f6f6f7; --paper-3: #ececee;
  --error: #b42318; --error-soft: #fdecea; --ready-deep: #15803d;
  --brand: {{ brand.brand }}; --brand-ink: {{ brand.brand_ink }};
  --sans: "IBM Plex Sans", "IBM Plex Sans Arabic", -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
html[lang="ar"] { --sans: "IBM Plex Sans Arabic", "IBM Plex Sans", -apple-system, sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--sans); color: var(--ink); background: var(--paper-2); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }
.page { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; padding: 18px clamp(16px, 4vw, 32px) max(18px, env(safe-area-inset-bottom)); }
.top { display: flex; justify-content: space-between; align-items: center; }
.wordmark { font-family: "Fraunces", serif; font-weight: 600; font-size: 18px; letter-spacing: -.01em; text-decoration: none; color: inherit; }
.lang { height: 38px; padding: 0 14px; border-radius: 10px; font-size: 14px; color: var(--grey); text-decoration: none; display: inline-flex; align-items: center; }
.gate { align-self: center; justify-self: center; width: 100%; max-width: 380px; text-align: center; padding: 24px 0; }
.logo { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-family: "Fraunces", serif; font-weight: 600; font-size: 28px; overflow: hidden; }
.logo img { width: 100%; height: 100%; object-fit: cover; }
.rname { font-size: 15px; color: var(--grey); }
h1 { margin-top: 4px; font-size: 26px; font-weight: 600; }
.sub { margin-top: 6px; color: var(--grey); font-size: 15px; }
.dots { margin: 28px auto 0; display: flex; justify-content: center; gap: 12px; direction: ltr; }
.dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 0 1.5px #c7c7cc inset; }
.dot.on { background: var(--ink); box-shadow: none; }
.dots.err .dot { box-shadow: 0 0 0 1.5px var(--error) inset; }
.dots.err .dot.on { background: var(--error); }
.dots.ok .dot { background: var(--ready-deep); box-shadow: none; }
.shake { animation: shake .42s var(--ease); }
@keyframes shake { 15%, 55% { transform: translateX(-9px); } 35%, 75% { transform: translateX(9px); } }
.msg { margin-top: 16px; min-height: 22px; font-size: 14.5px; font-weight: 500; }
.msg.err { color: var(--error); }
.pad { margin: 18px auto 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 312px; direction: ltr; }
.key { height: 72px; border-radius: 20px; background: var(--paper); box-shadow: 0 0 0 1px var(--line); font-family: "Fraunces", serif; font-size: 30px; font-weight: 500; display: grid; place-items: center; user-select: none; }
.key:active { background: var(--paper-3); }
.key.ghost { background: transparent; box-shadow: none; font-family: var(--sans); font-size: 15px; color: var(--grey); }
.key.ghost svg { width: 26px; height: 26px; }
.pad.locked .key { opacity: .35; pointer-events: none; }
.lock { margin: 28px auto 0; max-width: 340px; padding: 18px; border-radius: 18px; background: var(--error-soft); color: var(--error); }
.lock b { display: block; font-size: 15.5px; }
.lock .timer { font-family: "Fraunces", serif; font-size: 34px; font-weight: 500; margin-top: 4px; direction: ltr; font-variant-numeric: tabular-nums; }
.lock p { font-size: 13.5px; opacity: .85; margin-top: 4px; }
.foot { text-align: center; font-size: 14px; color: var(--grey); }
.foot a { color: var(--ink); font-weight: 500; }
@media (max-height: 720px) { .key { height: 60px; } .dots { margin-top: 20px; } .logo { width: 52px; height: 52px; font-size: 22px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="wordmark" href="/">Paiger</a>
    <a class="lang" href="/lang/{{ 'en' if lang == 'ar' else 'ar' }}">{{ t('nav.langSwitch') }}</a>
  </header>
  <main class="gate">
    <div class="logo">{% if brand.logo_url %}<img src="{{ brand.logo_url }}" alt="">{% else %}{{ brand.initial }}{% endif %}</div>
    <p class="rname">{{ restaurant.name }}</p>
    <h1>{{ t('pin.title') }}</h1>
    <p class="sub">{{ t('pin.sub') }}</p>
    <div id="entry">
      <div class="dots" id="dots" role="img"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <p class="msg" id="msg" role="alert" aria-live="assertive"></p>
      <div class="pad" id="pad">
        <button class="key" type="button">1</button><button class="key" type="button">2</button><button class="key" type="button">3</button>
        <button class="key" type="button">4</button><button class="key" type="button">5</button><button class="key" type="button">6</button>
        <button class="key" type="button">7</button><button class="key" type="button">8</button><button class="key" type="button">9</button>
        <span></span><button class="key" type="button">0</button>
        <button class="key ghost" type="button" data-del aria-label="{{ t('pin.delete') }}"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="M12.5 10.5l5 5M17.5 10.5l-5 5"/></svg></button>
      </div>
    </div>
    <div class="lock" id="lock" hidden role="alert">
      <b>{{ t('pin.lockT') }}</b>
      <div class="timer" id="timer">0:00</div>
      <p>{{ t('pin.lockP') }}</p>
    </div>
  </main>
  <footer class="foot"><span>{{ t('pin.owner') }} <a href="/login?next={{ login_next }}">{{ t('pin.login') }}</a></span></footer>
</div>
<script>
(function () {
  var wrong1 = {{ t('pin.wrong1')|tojson }};
  var wrongN = {{ t('pin.wrongN')|tojson }};
  var okText = {{ t('pin.ok')|tojson }};
  var pin = "", busy = false, lockTimer = null;
  var dots = Array.prototype.slice.call(document.querySelectorAll(".dot"));
  function paint() { dots.forEach(function (d, i) { d.classList.toggle("on", i < pin.length); }); }
  function lock(until) {
    busy = true;
    document.getElementById("entry").hidden = true;
    document.getElementById("lock").hidden = false;
    clearInterval(lockTimer);
    function tick() {
      var sec = Math.max(0, Math.round((new Date(until).getTime() - Date.now()) / 1000));
      document.getElementById("timer").textContent = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
      if (sec <= 0) { clearInterval(lockTimer); busy = false; document.getElementById("entry").hidden = false; document.getElementById("lock").hidden = true; }
    }
    tick(); lockTimer = setInterval(tick, 1000);
  }
  function submit() {
    busy = true;
    fetch(location.pathname.replace(/\/$/, "") + "/pin", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin: pin })
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data.ok) {
        document.getElementById("dots").classList.add("ok");
        document.getElementById("msg").textContent = okText;
        location.reload();
        return;
      }
      if (data.locked_until) return lock(data.locked_until);
      var box = document.getElementById("dots");
      box.classList.add("err"); box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      var left = data.remaining || 0;
      document.getElementById("msg").textContent = left === 1 ? wrong1 : wrongN.replace("{n}", left);
      document.getElementById("msg").className = "msg err";
      setTimeout(function () { pin = ""; paint(); busy = false; }, 450);
    }).catch(function () { busy = false; });
  }
  function press(k) {
    if (busy) return;
    document.getElementById("dots").classList.remove("err");
    document.getElementById("msg").textContent = "";
    if (k === "del") pin = pin.slice(0, -1); else if (pin.length < 6) pin += k;
    paint();
    if (pin.length === 6) submit();
  }
  document.getElementById("pad").addEventListener("click", function (e) {
    var b = e.target.closest(".key"); if (!b) return;
    press(b.hasAttribute("data-del") ? "del" : b.textContent.trim());
  });
  addEventListener("keydown", function (e) {
    var map = { "٠": "0", "١": "1", "٢": "2", "٣": "3", "٤": "4", "٥": "5", "٦": "6", "٧": "7", "٨": "8", "٩": "9" };
    var k = map[e.key] || e.key;
    if (/^[0-9]$/.test(k)) press(k); else if (e.key === "Backspace") press("del");
  });
  var initial = {{ locked_until|tojson }};
  if (initial) lock(initial);
})();
</script>
</body>
</html>
