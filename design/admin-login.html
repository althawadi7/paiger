<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<title>Admin · Trings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* TINGS · Super admin login (/admin/login). Dark shell on purpose: staff should never mistake it for the restaurant login. */
:root {
  --ink: #111111; --ink-2: #1c1c1e; --ink-3: #2a2a2d; --grey: #5f6368; --grey-2: #8e8e93; --line: #e6e6e8;
  --paper: #ffffff; --paper-2: #f6f6f7; --error: #b42318; --error-soft: #fdecea;
  --sans: "IBM Plex Sans", "IBM Plex Sans Arabic", -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
html[lang="ar"] { --sans: "IBM Plex Sans Arabic", "IBM Plex Sans", -apple-system, sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--ink); }
body { font-family: var(--sans); color: #fff; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
[hidden] { display: none !important; }

.page { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; padding: 20px clamp(16px, 4vw, 36px) max(20px, env(safe-area-inset-bottom));
  background: radial-gradient(1200px 600px at 50% -10%, #222225 0%, var(--ink) 60%); }
.top { display: flex; justify-content: space-between; align-items: center; }
.wm { display: flex; align-items: center; gap: 10px; }
.wm b { font-family: "Outfit", "IBM Plex Sans", -apple-system, sans-serif; font-weight: 600; font-size: 19px; letter-spacing: -.01em; }
.wm span { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--grey-2); padding: 3px 8px; border-radius: 6px; box-shadow: 0 0 0 1px var(--ink-3) inset; }
.lang { height: 38px; padding: 0 14px; border-radius: 10px; font-size: 14px; color: var(--grey-2); }
.lang:hover { color: #fff; background: var(--ink-2); }

.wrap { align-self: center; justify-self: center; width: 100%; max-width: 400px; padding: 28px 0; }
.head { margin-bottom: 22px; }
h1 { font-size: 28px; font-weight: 600; letter-spacing: -.015em; line-height: 1.2; }
.head p { margin-top: 6px; color: var(--grey-2); font-size: 15px; }

.card { background: var(--paper); color: var(--ink); border-radius: 22px; padding: 26px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.7); }
.f + .f { margin-top: 16px; }
.f label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 7px; }
.field { position: relative; }
.in { width: 100%; height: 50px; border: 0; border-radius: 13px; background: var(--paper-2); padding: 0 16px; font-size: 16px; outline: none; transition: box-shadow .15s, background .15s; }
.in:focus { background: #fff; box-shadow: 0 0 0 2px var(--ink) inset; }
.in.bad { box-shadow: 0 0 0 1.5px var(--error) inset; background: #fff; }
.field .in.pw { padding-inline-end: 64px; }
.eye { position: absolute; inset-block: 0; inset-inline-end: 6px; margin: auto 0; height: 38px; padding: 0 10px; border-radius: 9px; font-size: 13.5px; font-weight: 500; color: var(--grey); }
.eye:hover { background: var(--paper-2); color: var(--ink); }
.caps { margin-top: 7px; font-size: 13px; color: var(--grey); }

.err { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 18px; padding: 12px 14px; border-radius: 12px; background: var(--error-soft); color: var(--error); font-size: 14px; font-weight: 500; line-height: 1.45; }
.err svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }

.go { margin-top: 22px; width: 100%; height: 52px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background .15s, transform .08s; }
.go:hover { background: #2b2b2e; } .go:active { transform: scale(.985); }
.go[disabled] { opacity: .55; cursor: default; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; animation: r .7s linear infinite; }
@keyframes r { to { transform: rotate(360deg); } }

.note { margin-top: 18px; text-align: center; font-size: 13.5px; color: var(--grey-2); line-height: 1.6; }
.note a { color: #fff; }
.foot { text-align: center; font-size: 12.5px; color: #6b6b70; }

.proto { position: fixed; bottom: 10px; inset-inline-end: 10px; display: flex; gap: 4px; padding: 5px; border-radius: 12px; background: rgba(255,255,255,.96); color: var(--ink); font-size: 12px; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
.proto button { padding: 6px 9px; border-radius: 8px; }
.proto button.on { background: var(--ink); color: #fff; }
@media (max-width: 420px) { .card { padding: 20px; border-radius: 20px; } h1 { font-size: 25px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="wm"><b>Trings</b><span>Admin</span></div>
    <button class="lang" id="langBtn" type="button">العربية</button>
  </header>

  <main class="wrap">
    <div class="head">
      <h1 data-t="title">Platform admin</h1>
      <p data-t="sub">Restricted area. Sign in to manage restaurants, plans and payments.</p>
    </div>

    <form class="card" id="form" method="post" action="/admin/login" novalidate>
      <!-- {{ csrf_input }} -->
      <div class="err" id="err" role="alert" hidden>
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="7.2"/><path d="M9 5.4v4.2M9 12.4h.01"/></svg>
        <span id="errTxt"></span>
      </div>
      <div class="f">
        <label for="user" data-t="user">Username or email</label>
        <input class="in" id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" required>
      </div>
      <div class="f">
        <label for="pw" data-t="pw">Password</label>
        <div class="field">
          <input class="in pw" id="pw" name="password" type="password" autocomplete="current-password" dir="ltr" required>
          <button class="eye" type="button" id="eye" data-t="show">Show</button>
        </div>
        <p class="caps" id="caps" hidden data-t="caps">Caps Lock is on.</p>
      </div>
      <button class="go" id="go" type="submit"><span id="goTxt" data-t="signin">Sign in</span></button>
    </form>

    <p class="note"><span data-t="owner">Running a restaurant?</span> <a href="/login" data-t="ownerLink">Restaurant login</a></p>
  </main>

  <footer class="foot" data-t="foot">Sign-in attempts are logged.</footer>
</div>

<div class="proto" aria-label="Prototype states">
  <button type="button" class="on" data-s="normal">Normal</button>
  <button type="button" data-s="wrong">Wrong</button>
  <button type="button" data-s="locked">Locked</button>
</div>

<script>
(() => {
  "use strict";
  const T = {
    en: { title: "Platform admin", sub: "Restricted area. Sign in to manage restaurants, plans and payments.",
      user: "Username or email", pw: "Password", show: "Show", hide: "Hide", caps: "Caps Lock is on.", signin: "Sign in", signing: "Signing in…",
      empty: "Enter your username and password.", wrong: "Wrong username or password.", locked: "Too many attempts. Try again in 15 minutes.",
      owner: "Running a restaurant?", ownerLink: "Restaurant login", foot: "Sign-in attempts are logged." },
    ar: { title: "إدارة المنصة", sub: "منطقة خاصة. سجّل دخول لإدارة المطاعم والباقات والمدفوعات.",
      user: "اسم المستخدم أو الإيميل", pw: "كلمة المرور", show: "إظهار", hide: "إخفاء", caps: "زر الأحرف الكبيرة (Caps Lock) شغّال.", signin: "تسجيل الدخول", signing: "جاري الدخول…",
      empty: "اكتب اسم المستخدم وكلمة المرور.", wrong: "اسم المستخدم أو كلمة المرور غلط.", locked: "محاولات كثيرة. حاول بعد ١٥ دقيقة.",
      owner: "عندك مطعم؟", ownerLink: "دخول المطاعم", foot: "كل محاولات الدخول تنسجّل." },
  };
  let lang = "en"; try { lang = localStorage.getItem("paiger.lang") || "en"; } catch (_) {}
  let errKey = null;
  const $ = (id) => document.getElementById(id);
  const t = (k) => T[lang][k];
  function apply() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-t]").forEach((n) => (n.textContent = t(n.dataset.t)));
    $("eye").textContent = t($("pw").type === "password" ? "show" : "hide");
    $("langBtn").textContent = lang === "ar" ? "English" : "العربية";
    if (errKey) $("errTxt").textContent = t(errKey);
  }
  $("langBtn").onclick = () => { lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("paiger.lang", lang); } catch (_) {} apply(); };
  $("eye").onclick = () => { const p = $("pw"); p.type = p.type === "password" ? "text" : "password"; apply(); p.focus(); };
  $("pw").addEventListener("keyup", (e) => { if (e.getModifierState) $("caps").hidden = !e.getModifierState("CapsLock"); });

  function showErr(k) {
    errKey = k; $("err").hidden = !k; if (k) $("errTxt").textContent = t(k);
    $("user").classList.toggle("bad", k === "empty" && !$("user").value || k === "wrong");
    $("pw").classList.toggle("bad", k === "empty" && !$("pw").value || k === "wrong");
    $("go").disabled = k === "locked";
  }
  ["user", "pw"].forEach((id) => $(id).addEventListener("input", () => { if (errKey !== "locked") showErr(null); }));

  $("form").addEventListener("submit", (e) => {
    e.preventDefault(); // PROTOTYPE: production posts the form normally; server re-renders with error_key
    if (!$("user").value.trim() || !$("pw").value) return showErr("empty");
    $("go").disabled = true; $("goTxt").textContent = t("signing");
    $("go").insertAdjacentHTML("afterbegin", '<span class="spin"></span>');
    setTimeout(() => { $("go").querySelector(".spin")?.remove(); $("go").disabled = false; $("goTxt").textContent = t("signin"); $("pw").value = ""; showErr("wrong"); $("pw").focus(); }, 800);
  });

  document.querySelector(".proto").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll(".proto button").forEach((x) => x.classList.toggle("on", x === b));
    showErr(b.dataset.s === "normal" ? null : b.dataset.s);
  });
  apply();
  $("user").focus();
})();
</script>
</body>
</html>
