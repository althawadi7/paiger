<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Cashier · Karak House · Paiger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* PAIGER · Cashier PIN gate  (/r/{slug}/cashier when the device has no cashier session) */
:root {
  --ink: #111111; --grey: #5f6368; --grey-2: #8e8e93; --line: #e6e6e8;
  --paper: #ffffff; --paper-2: #f6f6f7; --paper-3: #ececee;
  --error: #b42318; --error-soft: #fdecea; --ready-deep: #15803d;
  --brand: #c2410c; --brand-ink: #fff;
  --sans: "IBM Plex Sans", "IBM Plex Sans Arabic", -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
html[lang="ar"] { --sans: "IBM Plex Sans Arabic", "IBM Plex Sans", -apple-system, sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--sans); color: var(--ink); background: var(--paper-2); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }

.page { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; padding: 18px clamp(16px, 4vw, 32px) max(18px, env(safe-area-inset-bottom)); }
.top { display: flex; justify-content: space-between; align-items: center; }
.wordmark { font-family: "Fraunces", serif; font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
.lang { height: 38px; padding: 0 14px; border-radius: 10px; font-size: 14px; color: var(--grey); }
.lang:hover { background: var(--paper-3); color: var(--ink); }

.gate { align-self: center; justify-self: center; width: 100%; max-width: 380px; text-align: center; padding: 24px 0; }
.logo { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-family: "Fraunces", serif; font-weight: 600; font-size: 28px; overflow: hidden; }
.rname { font-size: 15px; color: var(--grey); }
h1 { margin-top: 4px; font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
.sub { margin-top: 6px; color: var(--grey); font-size: 15px; min-height: 1.5em; }

.dots { margin: 28px auto 0; display: flex; justify-content: center; gap: 12px; direction: ltr; }
.dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 0 1.5px #c7c7cc inset; transition: background .12s, box-shadow .12s, transform .12s; }
.dot.on { background: var(--ink); box-shadow: none; transform: scale(1.05); }
.dots.err .dot { box-shadow: 0 0 0 1.5px var(--error) inset; }
.dots.err .dot.on { background: var(--error); }
.dots.ok .dot { background: var(--ready-deep); box-shadow: none; }
.shake { animation: shake .42s var(--ease); }
@keyframes shake { 15%, 55% { transform: translateX(-9px); } 35%, 75% { transform: translateX(9px); } }
.msg { margin-top: 16px; min-height: 22px; font-size: 14.5px; font-weight: 500; }
.msg.err { color: var(--error); }

.pad { margin: 18px auto 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 312px; direction: ltr; }
.key { height: 72px; border-radius: 20px; background: var(--paper); box-shadow: 0 0 0 1px var(--line); font-family: "Fraunces", serif; font-size: 30px; font-weight: 500; display: grid; place-items: center; transition: background .1s, transform .08s; user-select: none; }
.key:active { background: var(--paper-3); transform: scale(.97); }
.key.ghost { background: transparent; box-shadow: none; font-family: var(--sans); font-size: 15px; font-weight: 500; color: var(--grey); }
.key.ghost svg { width: 26px; height: 26px; }
.pad.locked .key { opacity: .35; pointer-events: none; }

.lock { margin: 28px auto 0; max-width: 340px; padding: 18px; border-radius: 18px; background: var(--error-soft); color: var(--error); }
.lock b { display: block; font-size: 15.5px; }
.lock .timer { font-family: "Fraunces", serif; font-size: 34px; font-weight: 500; margin-top: 4px; direction: ltr; font-variant-numeric: tabular-nums; }
.lock p { font-size: 13.5px; opacity: .85; margin-top: 4px; }

.foot { text-align: center; font-size: 14px; color: var(--grey); display: grid; gap: 6px; }
.foot a { color: var(--ink); font-weight: 500; }

.proto { position: fixed; bottom: 10px; inset-inline-end: 10px; display: flex; gap: 4px; padding: 5px; border-radius: 12px; background: rgba(255,255,255,.96); box-shadow: 0 0 0 1px var(--line), 0 10px 30px -10px rgba(0,0,0,.25); font-size: 12px; }
.proto button { padding: 6px 9px; border-radius: 8px; }
.proto button.on { background: var(--ink); color: #fff; }

@media (max-height: 720px) { .key { height: 60px; } .dots { margin-top: 20px; } .logo { width: 52px; height: 52px; font-size: 22px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <span class="wordmark">Paiger</span>
    <button class="lang" id="langBtn" type="button">العربية</button>
  </header>

  <main class="gate">
    <div class="logo">K</div>
    <p class="rname">Karak House</p>
    <h1 data-t="title">Enter cashier PIN</h1>
    <p class="sub" data-t="sub">Ask the owner for the 6-digit PIN. You only enter it once on this device.</p>

    <div id="entry">
      <div class="dots" id="dots" role="img" aria-label="PIN progress">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <p class="msg" id="msg" role="alert" aria-live="assertive"></p>
      <div class="pad" id="pad">
        <button class="key" type="button">1</button><button class="key" type="button">2</button><button class="key" type="button">3</button>
        <button class="key" type="button">4</button><button class="key" type="button">5</button><button class="key" type="button">6</button>
        <button class="key" type="button">7</button><button class="key" type="button">8</button><button class="key" type="button">9</button>
        <span></span><button class="key" type="button">0</button>
        <button class="key ghost" type="button" data-del aria-label="Delete"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="M12.5 10.5l5 5M17.5 10.5l-5 5"/></svg></button>
      </div>
    </div>

    <div class="lock" id="lock" hidden role="alert">
      <b data-t="lockT">Too many wrong tries</b>
      <div class="timer" id="timer">5:00</div>
      <p data-t="lockP">This device is paused. Check the PIN with the owner and try again when the timer ends.</p>
    </div>
  </main>

  <footer class="foot">
    <span><span data-t="owner">Restaurant owner?</span> <a href="/login?next=/r/karak-house/cashier" data-t="login">Log in instead</a></span>
  </footer>
</div>

<div class="proto" aria-label="Prototype states">
  <button type="button" class="on" data-s="normal">Normal</button>
  <button type="button" data-s="locked">Locked</button>
</div>

<script>
(() => {
  "use strict";
  const T = {
    en: { title: "Enter cashier PIN", sub: "Ask the owner for the 6-digit PIN. You only enter it once on this device.",
      wrong: (n) => n === 1 ? "Wrong PIN. 1 try left before a short pause." : `Wrong PIN. ${n} tries left.`, ok: "Opening the cashier…",
      lockT: "Too many wrong tries", lockP: "This device is paused. Check the PIN with the owner and try again when the timer ends.",
      owner: "Restaurant owner?", login: "Log in instead" },
    ar: { title: "أدخل رمز الكاشير", sub: "اطلب الرمز من صاحب المطعم، ٦ أرقام. تدخله مرة وحدة بس على هذا الجهاز.",
      wrong: (n) => n === 1 ? "الرمز غلط. باقي محاولة وحدة قبل إيقاف مؤقت." : `الرمز غلط. باقي ${n} محاولات.`, ok: "جاري فتح الكاشير…",
      lockT: "محاولات غلط كثيرة", lockP: "الجهاز موقّف مؤقتاً. تأكد من الرمز مع صاحب المطعم وحاول بعد ما يخلص الوقت.",
      owner: "صاحب المطعم؟", login: "سجّل دخول بدلاً من الرمز" },
  };
  let lang = "en"; try { lang = localStorage.getItem("paiger.lang") || "en"; } catch (_) {}
  const t = (k, ...a) => { const v = T[lang][k]; return typeof v === "function" ? v(...a) : v; };
  const $ = (id) => document.getElementById(id);
  const dots = [...document.querySelectorAll(".dot")];
  const DEMO_PIN = "246810"; // PROTOTYPE ONLY: real check is POST /r/{slug}/cashier/pin on the server
  let pin = "", left = 5, busy = false, lockTimer;

  function apply() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-t]").forEach((n) => (n.textContent = t(n.dataset.t)));
    $("langBtn").textContent = lang === "ar" ? "English" : "العربية";
  }
  $("langBtn").onclick = () => { lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("paiger.lang", lang); } catch (_) {} apply(); };

  function paint() { dots.forEach((d, i) => d.classList.toggle("on", i < pin.length)); }
  function press(k) {
    if (busy) return;
    $("dots").classList.remove("err"); $("msg").textContent = ""; $("msg").className = "msg";
    if (k === "del") pin = pin.slice(0, -1); else if (pin.length < 6) pin += k;
    paint();
    if (pin.length === 6) submit();
  }
  function submit() {
    busy = true;
    setTimeout(() => {           // server round trip
      if (pin === DEMO_PIN) {
        $("dots").classList.add("ok"); $("msg").textContent = t("ok");
        setTimeout(() => { location.href = "cashier.html"; }, 700);
        return;
      }
      left -= 1;
      if (left <= 0) return lock(300);
      $("dots").classList.add("err"); const d = $("dots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake");
      $("msg").textContent = t("wrong", left); $("msg").className = "msg err";
      if (navigator.vibrate) navigator.vibrate(120);
      setTimeout(() => { pin = ""; paint(); busy = false; }, 450);
    }, 350);
  }
  function lock(sec) {
    pin = ""; paint(); busy = true;
    $("entry").hidden = true; $("lock").hidden = false;
    clearInterval(lockTimer);
    const tick = () => { $("timer").textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; if (sec-- <= 0) unlock(); };
    tick(); lockTimer = setInterval(tick, 1000);
  }
  function unlock() { clearInterval(lockTimer); left = 5; busy = false; $("entry").hidden = false; $("lock").hidden = true; $("msg").textContent = ""; }

  $("pad").addEventListener("click", (e) => { const b = e.target.closest(".key"); if (!b) return; press(b.hasAttribute("data-del") ? "del" : b.textContent); });
  addEventListener("keydown", (e) => {
    const map = { "٠": "0", "١": "1", "٢": "2", "٣": "3", "٤": "4", "٥": "5", "٦": "6", "٧": "7", "٨": "8", "٩": "9" };
    const k = map[e.key] || e.key;
    if (/^[0-9]$/.test(k)) press(k); else if (e.key === "Backspace") press("del");
  });
  document.querySelector(".proto").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll(".proto button").forEach((x) => x.classList.toggle("on", x === b));
    b.dataset.s === "locked" ? lock(300) : unlock();
  });
  apply();
})();
</script>
</body>
</html>
